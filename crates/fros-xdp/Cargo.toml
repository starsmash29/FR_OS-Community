[package]
name = "fros-xdp"
description = "The XDP SNI filter's userland: the kernel program (crates/fros-xdp-ebpf) held to FR_OS 1.x's bpf/xdp_sni_filter.c"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
# Loads the kernel program, pins it and its maps, and keeps the maps
# (fr-xdp); in the tests, runs it on recorded frames (BPF_PROG_TEST_RUN).
# Pure Rust over the bpf() syscall, no libbpf: bpftool's libbpf no
# longer reads aya-ebpf's legacy map section (src/pins.rs).
aya = { version = "=0.14.0", default-features = false }
# The event logger's JSON, as Python's json.dumps writes it.
fros-sensor = { path = "../fros-sensor" }

[lints]
workspace = true
