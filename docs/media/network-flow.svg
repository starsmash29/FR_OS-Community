<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="320" viewBox="0 0 1060 320" role="img" aria-labelledby="title description">
  <title id="title">FR_OS Community Edition network architecture</title>
  <desc id="description">Internet traffic enters Linux XDP and nftables before reaching LAN and VPN clients. Local network signals feed AI Perimeter. Approved proposals reach the Go control plane through a separate management path.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#121e2b"/><stop offset="1" stop-color="#09101a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#344558" stroke-opacity=".28"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#9cadbf"/>
    </marker>
  </defs>
  <style>
    .label {font:700 19px system-ui,sans-serif;fill:#f4f7fb}
    .sub {font:15px system-ui,sans-serif;fill:#b8c7d8}
    .tag {font:700 13px ui-monospace,monospace;letter-spacing:2px;fill:#ff9a72}
    .edge {fill:none;stroke:#9cadbf;stroke-width:2;marker-end:url(#arrow)}
    .pulse {fill:none;stroke:#ff8052;stroke-width:4;stroke-linecap:round;stroke-dasharray:10 142;animation:flow 4s linear 3}
    .sense {stroke:#66dec7;animation-delay:.4s}
    @keyframes flow {to {stroke-dashoffset:-304}}
    @media (prefers-reduced-motion:reduce) {.pulse {animation:none}}
  </style>
  <rect x="1" y="1" width="1058" height="318" rx="22" fill="url(#background)" stroke="#43576d"/>
  <rect x="1" y="1" width="1058" height="318" rx="22" fill="url(#grid)"/>
  <text x="42" y="46" class="tag">PACKET PATH</text>
  <text x="42" y="200" class="tag">MANAGEMENT &amp; EVIDENCE</text>

  <path class="edge" d="M222 111H393"/><path class="pulse" d="M226 111H387"/>
  <path class="edge" d="M665 111H835"/><path class="pulse" d="M669 111H829"/>
  <path class="edge" d="M530 152V212"/><path class="pulse sense" d="M530 156V206"/>
  <path class="edge" d="M665 250H785"/><path class="pulse sense" d="M669 250H779"/>
  <path class="edge" d="M911 211V168H644V153"/>

  <rect x="42" y="74" width="180" height="76" rx="13" fill="#152333" stroke="#445a70"/>
  <rect x="393" y="72" width="272" height="80" rx="13" fill="#31221d" stroke="#ff8052"/>
  <rect x="835" y="74" width="183" height="76" rx="13" fill="#152333" stroke="#445a70"/>
  <rect x="393" y="212" width="272" height="76" rx="13" fill="#112c2d" stroke="#66dec7"/>
  <rect x="785" y="212" width="233" height="76" rx="13" fill="#152333" stroke="#445a70"/>
  <text x="60" y="105" class="label">WAN</text><text x="60" y="129" class="sub">Upstream network</text>
  <text x="414" y="105" class="label">Linux firewall</text><text x="414" y="130" class="sub">eBPF / XDP + nftables</text>
  <text x="853" y="105" class="label">LAN + VPN</text><text x="853" y="129" class="sub">Zones and devices</text>
  <text x="414" y="243" class="label">AI Perimeter</text><text x="414" y="267" class="sub">Local evidence and proposals</text>
  <text x="805" y="243" class="label">Go control plane</text><text x="805" y="267" class="sub">Review and confirmed apply</text>
  <text x="550" y="179" class="sub">Local signals</text>
</svg>
