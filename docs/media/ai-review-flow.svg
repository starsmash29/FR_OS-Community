<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title desc">
<title id="title">FR_OS AI Perimeter: evidence to approved action</title>
<desc id="desc">A conceptual animation connects local observations, AI explanation, deterministic checks, administrator review and confirmed apply. The model has no direct access to the privileged apply helper.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#081524"/><stop offset="1" stop-color="#142c39"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#224454" stroke-opacity=".4"/></pattern>
</defs>
<style>
.heading{font:700 29px system-ui,sans-serif;fill:#f1f7fa}
.label{font:700 18px system-ui,sans-serif;fill:#eff8ff}
.sub{font:14px system-ui,sans-serif;fill:#b6cbda}
.tag{font:700 12px ui-monospace,monospace;fill:#6ae3c5;letter-spacing:2px}
.wire{fill:none;stroke:#456c82;stroke-width:2}
.pulse{fill:none;stroke:#6ae3c5;stroke-width:4;stroke-dasharray:12 100;animation:travel 3s linear 4}
.review{stroke:#ffb16f}
@keyframes travel{to{stroke-dashoffset:-224}}
@media(prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<rect x="1" y="1" width="1118" height="348" rx="24" fill="url(#bg)" stroke="#375565"/>
<rect x="1" y="1" width="1118" height="348" rx="24" fill="url(#grid)"/>
<text x="36" y="42" class="tag">AI PERIMETER / CONCEPTUAL WORKFLOW</text>
<text x="36" y="83" class="heading">The model proposes. You control the change.</text>
<path class="wire" d="M218 178H258M428 178H468M638 178H678M848 178H888"/>
<path class="pulse" d="M218 178H258M428 178H468M638 178H678"/>
<path class="pulse review" d="M848 178H888"/>
<g fill="#102535" stroke="#416477">
<rect x="36" y="126" width="182" height="108" rx="14"/>
<rect x="258" y="126" width="170" height="108" rx="14"/>
<rect x="468" y="126" width="170" height="108" rx="14"/>
<rect x="678" y="126" width="170" height="108" rx="14" stroke="#ffb16f"/>
<rect x="888" y="126" width="196" height="108" rx="14"/>
</g>
<text x="54" y="154" class="tag">01 / OBSERVE</text>
<text x="54" y="183" class="label">Local evidence</text><text x="54" y="210" class="sub">DNS · TLS · IDS · apps</text>
<text x="276" y="154" class="tag">02 / EXPLAIN</text>
<text x="276" y="183" class="label">AI Perimeter</text><text x="276" y="210" class="sub">Citations &amp; proposal</text>
<text x="486" y="154" class="tag">03 / VALIDATE</text>
<text x="486" y="183" class="label">Policy checks</text><text x="486" y="210" class="sub">Schema · lint · diff</text>
<text x="696" y="154" class="tag">04 / REVIEW</text>
<text x="696" y="183" class="label">Your decision</text><text x="696" y="210" class="sub">Inspect &amp; approve</text>
<text x="906" y="154" class="tag">05 / CONFIRM</text>
<text x="906" y="183" class="label">Apply or roll back</text><text x="906" y="210" class="sub">Check connectivity</text>
<path d="M36 266H1084" class="wire"/>
<text x="36" y="298" class="label">Local model option. Bounded proposals. Explicit administrator approval.</text>
<text x="36" y="324" class="sub">The assistant cannot call the privileged apply helper. An unconfirmed configuration apply rolls back.</text>
</svg>
