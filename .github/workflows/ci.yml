name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: no encoding/json v1
        run: |
          if grep -rn --include='*.go' '"encoding/json"' .; then
            echo "use encoding/json/v2 (AGENTS.md)"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race=false ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: toolchain from rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets
      - run: cargo test --locked
      - name: cargo audit
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo audit
