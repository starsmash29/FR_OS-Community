name: Build installer ISO

# The FR_OS image, built and booted in QEMU (installer/qemu-boot-test.py).
# A full live-build run downloads and assembles an entire Debian system
# (tens of minutes, real bandwidth), so it runs by hand from the Actions
# tab, and on a pull request only when what goes into the image changes.
#
# Releases (docs/RELEASING.md): run it *from the release's tag* ("Use
# workflow from" -> Tags -> vX.Y.Z) with release_tag = vX.Y.Z, for a
# GitHub release that already exists. The release signing key is the
# FROS_RELEASE_SIGNING_KEY secret of the `release` environment, which
# only v* tags may deploy to: only the two signing jobs get it, only when
# the run is for a release; the jobs that build and boot the image never
# see it. A run on a branch or a pull request is a test build: never
# signed with the release key; its release tarballs are signed with a key
# made for the run and thrown away, which only its own image trusts, so
# the boot test can install a release and roll back. A release is built from exactly the commit its tag names,
# with the version its VERSION file says, and only after two different
# models reviewed it (security-lessons J2, release/reviewgate) -- as 1.x's
# workflow.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish to this existing release (e.g. v2.0.0) -- run the workflow from that tag; empty = test build, unsigned"
        required: false
        default: ""
      boot_test:
        description: "Boot the ISO in QEMU with BIOS and with UEFI (installer/qemu-boot-test.py)"
        type: boolean
        default: true
  pull_request:
    paths:
      - "installer/**"
      - "scripts/**"
      - "systemd/**"
      - "release/**"
      - "version/**"
      - "VERSION"
      - ".github/workflows/build-installer.yml"

# Nothing may write unless its job says so (only `publish` does).
permissions:
  contents: read

jobs:
  # The programs the image installs and a router's updater takes, packed
  # into the release tarball (installer/package-release.sh) -- without
  # the signing key.
  stage:
    runs-on: ubuntu-24.04
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # the review gate compares commits and tags
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Release gate -- the tag, the commit, the adversarial review (security-lessons J2)
        # Checked first, before the toolchains and the build: a release is
        # built from its tag (the commit the tag names is the commit
        # checked out here), its version is the tag's, and at least two
        # different AI models reviewed it with every critical or high
        # finding closed (docs/RELEASING.md, "Before tagging").
        if: ${{ inputs.release_tag != '' }}
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(cat VERSION)
          if [ "$RELEASE_TAG" != "v$version" ]; then
            echo "::error::release_tag $RELEASE_TAG doesn't match the VERSION file (v$version)"
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/tags/$RELEASE_TAG" ]; then
            echo "::error::a release is built from its tag: run this workflow from $RELEASE_TAG, not $GITHUB_REF"
            exit 1
          fi
          tag_sha=$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")
          if [ "$tag_sha" != "$GITHUB_SHA" ] || [ "$(git rev-parse HEAD)" != "$tag_sha" ]; then
            echo "::error::$RELEASE_TAG names $tag_sha, but this run checked out $GITHUB_SHA"
            exit 1
          fi
          go run ./release/reviewgate "$version"

      # The other toolchains, as ci.yml's: Rust from
      # rust-toolchain.toml (with the musl target the image's binaries
      # are linked against), the eBPF crate's nightly and bpf-linker.
      - name: Rust toolchains
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add x86_64-unknown-linux-musl
          cd crates/fros-xdp-ebpf && (rustup show active-toolchain || rustup toolchain install)
      - name: bpf-linker 0.13.0, against the pinned nightly's LLVM
        run: |
          lib=$(cd crates/fros-xdp-ebpf && rustc --print sysroot)/lib
          llvm=$(basename "$(ls "$lib"/libLLVM*.so)" .so)
          RUSTFLAGS="-L $lib -l dylib=${llvm#lib} -C link-arg=-Wl,-rpath,$lib" \
            cargo install bpf-linker --version 0.13.0 --locked --no-default-features --features llvm-23,no-llvm-linking

      # A test build's own key, made for this run and thrown away at its
      # end: the image it builds trusts it besides the release keys, so
      # the boot test can install a signed release and roll back to the
      # image's own (phase 4f-4b). Never on a release, whose image trusts
      # the release keys alone.
      - name: The boot test's throwaway signing key (test builds only)
        if: ${{ inputs.release_tag == '' }}
        run: |
          umask 077
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/boot-test.key"
          openssl pkey -in "$RUNNER_TEMP/boot-test.key" -pubout -out release/keys/boot-test.pem
          chmod 0644 release/keys/boot-test.pem

      - name: Build what the image installs (installer/build-binaries.sh)
        run: installer/build-binaries.sh "$RUNNER_TEMP/stage"

      - name: Pack the release tarball (installer/package-release.sh)
        # Every mtime is the commit's: the same commit packs the same bytes.
        run: SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" installer/package-release.sh "$RUNNER_TEMP/stage" release

      # The release the boot test installs: the same programs as the next
      # version's beta (FROS_TEST_VERSION, never a release's), and both
      # tarballs signed with the throwaway key, which goes with the job.
      - name: The boot test's next release, both signed (test builds only)
        if: ${{ inputs.release_tag == '' }}
        run: |
          version=$(cat VERSION)
          case "$version" in
            *-beta.*) next="${version%.*}.$(( ${version##*.} + 1 ))" ;;
            *) next="${version%.*}.$(( ${version##*.} + 1 ))-beta.1" ;;
          esac
          FROS_TEST_VERSION="$next" installer/build-binaries.sh "$RUNNER_TEMP/stage-next"
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" installer/package-release.sh "$RUNNER_TEMP/stage-next" release-next
          SIGNING_KEY="$(cat "$RUNNER_TEMP/boot-test.key")" ./scripts/sign-sums.sh release/SHA256SUMS
          SIGNING_KEY="$(cat "$RUNNER_TEMP/boot-test.key")" ./scripts/sign-sums.sh release-next/SHA256SUMS
          rm -f "$RUNNER_TEMP/boot-test.key"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          # A release's goes to sign-stage; a test build's is signed with
          # the throwaway key.
          name: ${{ inputs.release_tag != '' && 'release-unsigned' || 'release-test' }}
          path: release/
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ inputs.release_tag == '' }}
        with:
          name: release-next-test
          path: release-next/
          if-no-files-found: error

  # The one job besides `publish` that holds the signing key: it signs the
  # tarball's SHA256SUMS *before* the image is built, because the image
  # carries its own signed release (/opt/fr_os/releases/<VERSION>/) and
  # the published SHA256SUMS can't be inside the ISO it covers. It runs
  # the tag's own scripts/sign-sums.sh, which refuses a key whose public
  # half this commit doesn't ship and checks the signature as a router
  # will.
  sign-stage:
    if: ${{ inputs.release_tag != '' }}
    needs: stage
    runs-on: ubuntu-24.04
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-unsigned
          path: release
      - name: Sign the tarball's SHA256SUMS
        env:
          SIGNING_KEY: ${{ secrets.FROS_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/sign-sums.sh release/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: release-signed
          path: release/
          if-no-files-found: error

  # Builds and boot-tests the image from the release tarball -- with no
  # access to the signing key.
  image:
    needs: [stage, sign-stage]
    if: ${{ !cancelled() && needs.stage.result == 'success' && (needs.sign-stage.result == 'success' || needs.sign-stage.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      BOOT_TEST: ${{ github.event_name == 'pull_request' || inputs.boot_test }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Install live-build tooling
        run: |
          sudo apt-get update
          # The list from installer/build-live-image.sh's header --
          # syslinux-common provides the ldlinux/libcom32/libutil modules
          # the isolinux bootloader directory links to.
          sudo apt-get install -y \
            live-build debootstrap xorriso squashfs-tools isolinux \
            syslinux-common syslinux-efi syslinux-utils librsvg2-bin \
            grub-pc-bin grub-efi-amd64-bin grub-common mtools dosfstools \
            debian-archive-keyring

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          # A release's tarball signed with the release key; a test
          # build's with its throwaway key.
          name: ${{ inputs.release_tag != '' && 'release-signed' || 'release-test' }}
          path: release
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        if: ${{ inputs.release_tag == '' }}
        with:
          name: release-next-test
          path: release-next

      - name: Build hybrid live/installer ISO
        run: sudo ./installer/build-live-image.sh --release "$PWD/release"

      - name: Name the ISO, list the files to publish
        id: iso
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          version=$(cat VERSION)
          if [ -n "$RELEASE_TAG" ]; then
            name="FR_OS-${version}-amd64.iso"
            kind="FR_OS ${version}"
          else
            name="FR_OS-${version}-dev-${GITHUB_SHA::12}-amd64.iso"
            kind="FR_OS test build (unsigned)"
          fi
          sudo mv installer/live-build/binary.hybrid.iso "$name"
          sudo chown "$(id -u):$(id -g)" "$name"
          # The very tarball the image installed and carries.
          tarball="fr_os-${version}-amd64.tar.gz"
          cp "release/$tarball" "$tarball"
          sha256sum "$name" "$tarball" > SHA256SUMS
          {
            echo
            echo "# ${kind} -- hybrid BIOS/UEFI live image, amd64, and the release tarball its updater installs."
            echo "# Built by GitHub Actions from commit ${GITHUB_SHA} (${GITHUB_REF_NAME})."
            echo "# Verify: sha256sum -c SHA256SUMS"
          } >> SHA256SUMS
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          cat SHA256SUMS

      - name: Boot test in QEMU with BIOS (persistence, first boot, webUI, fallback, kernel, update)
        if: ${{ env.BOOT_TEST == 'true' }}
        run: |
          # radvd and kea-dhcp6 are the test's IPv6 provider on the WAN
          # (ROADMAP FND-1a): RA, DHCPv6 and prefix delegation.
          sudo apt-get install -y qemu-system-x86 ovmf radvd kea-dhcp6-server wireguard-tools
          next=""
          if [ -d release-next ]; then next="--next-release $PWD/release-next"; fi
          # shellcheck disable=SC2086 # $next is one option and its value, or nothing
          sudo python3 installer/qemu-boot-test.py "${{ steps.iso.outputs.name }}" --kvm --workdir qemu-test $next

      # The same boots from a fresh stick with UEFI firmware (OVMF): both
      # firmwares boot from the same GRUB menu.
      - name: Boot test in QEMU with UEFI
        if: ${{ env.BOOT_TEST == 'true' }}
        run: |
          next=""
          if [ -d release-next ]; then next="--next-release $PWD/release-next"; fi
          # shellcheck disable=SC2086 # $next is one option and its value, or nothing
          sudo python3 installer/qemu-boot-test.py "${{ steps.iso.outputs.name }}" --kvm --uefi --workdir qemu-test-uefi $next

      - name: Upload QEMU logs
        if: ${{ always() && env.BOOT_TEST == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: qemu-boot-test-logs
          path: |
            qemu-test/boot*.log
            qemu-test-uefi/boot*.log
          if-no-files-found: ignore

      - name: Upload ISO artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fr-os-installer
          path: |
            ${{ steps.iso.outputs.name }}
            ${{ steps.iso.outputs.tarball }}
            SHA256SUMS
          if-no-files-found: error

  # Signs the published SHA256SUMS (the ISO and the tarball) and attaches
  # the files to the release -- the second job with the key, and the only
  # one that may write to the repository.
  publish:
    if: ${{ inputs.release_tag != '' }}
    needs: image
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5  # v5.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: fr-os-installer
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: release-signed
          path: signed
      - name: Check the tarball is the one sign-stage signed
        # The image job has no key but runs apt, live-build and QEMU as
        # root: what it hands over is signed only if its tarball is,
        # byte for byte, the one sign-stage signed from the stage job's
        # build, checked with the keys this commit ships (review
        # v2.0.0-beta.1 R1).
        run: |
          tarball="fr_os-$(cat VERSION)-amd64.tar.gz"
          go run ./release/verify signed/SHA256SUMS
          cmp "signed/$tarball" "dist/$tarball"
      - name: Sign SHA256SUMS
        # A release must be signed: routers refuse an update whose
        # SHA256SUMS.sig doesn't verify (docs/RELEASING.md). Only what a
        # router will accept is published: the key must be one this very
        # commit ships, and the signature must verify (scripts/sign-sums.sh).
        env:
          SIGNING_KEY: ${{ secrets.FROS_RELEASE_SIGNING_KEY }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: ./scripts/sign-sums.sh dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: fr-os-release
          path: dist/
          if-no-files-found: error
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
