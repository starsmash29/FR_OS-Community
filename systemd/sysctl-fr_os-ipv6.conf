# Installed as /etc/sysctl.d/50-fr_os-ipv6.conf.
# The kernel takes no Router Advertisement, redirect or source route, and
# makes no SLAAC address of its own, on any interface, from boot on:
# dhcpcd (fr-dhcp6) reads the WAN's RA itself, and its addresses are
# stable ones that don't carry the MAC (RFC 7217). An apply writes the
# same values (render.Sysctls) but only in its IPv6 step, after the
# ruleset that lets the provider's RA in is loaded: an RA in between
# used to leave the WAN with an EUI-64 address the kernel made, which
# writing autoconf=0 afterwards doesn't remove (decisions.md, "the
# kernel's RA settings at boot"). The glob covers all, default and every
# port, and systemd's udev rule applies it to each interface added
# later (VLANs, the WireGuard tunnel).
net.ipv6.conf.*.accept_ra = 0
net.ipv6.conf.*.accept_redirects = 0
net.ipv6.conf.*.accept_source_route = 0
net.ipv6.conf.*.autoconf = 0
