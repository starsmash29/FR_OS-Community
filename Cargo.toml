[workspace]
resolver = "3"
members = [
    "crates/fros-aiids",
    "crates/fros-appid",
    "crates/fros-iot",
    "crates/fros-ipc",
    "crates/fros-sensor",
    "crates/fros-tlsfp",
    "crates/fros-xdp",
]
# Builds for the BPF target with nightly and bpf-linker (its own
# rust-toolchain.toml).
exclude = ["crates/fros-xdp-ebpf"]

[workspace.package]
version = "2.0.0-dev"
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97"
repository = "https://github.com/starsmash29/FR_OS-Community"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
